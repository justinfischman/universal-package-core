# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: upc

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: upc
    main: ./cmd/upc
    binary: upc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    # Windows is a backlog feature (docs/CHANGELOG.md, Deferred); to re-enable,
    # add windows to goos, ignore windows/arm64 and restore the zip override.
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: upc
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

# Publishing is skipped for snapshots. The tap lives in this repository (Formula/),
# pushed with the workflow's GITHUB_TOKEN (see docs/RELEASING.md).
brews:
  - name: upc
    directory: Formula
    repository:
      owner: justinfischman
      name: universal-package-core
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: https://github.com/justinfischman/universal-package-core
    description: Create, install and manage packages and apps across languages
    test: |
      system "#{bin}/upc", "version"
